# Nightly validation av YouTube-klippen i backend/content/catalog/*.yaml
# mot YouTube Data API v3. Fångar klipp som blivit:
#   - missing (videoId borttagen / privat)
#   - blocked (region-restriction adderad, age-gate, embeddable=false,
#     definition nedgraderad till SD)
#
# Re-uploads (MASTER RJ, prod. ovr, SLAYERO MUSIC, thelanoz video Comeback)
# är inte original-rättsinnehavarens uppladdningar — kan tas ner via
# copyright-claim utan förvarning. Nightly cron ger oss tidig signal innan
# en användare träffar ett brutet klipp i appen.
#
# Pre-launch krav:
#   1. YOUTUBE_API_KEY adderas som repo secret
#      (Settings → Secrets and variables → Actions → New repository secret)
#   2. Verifiera att första körningen lyckas — kolla Actions-fliken
#   3. Failure-notifikationer: GitHub mejlar repo owner by default. Lägg
#      ev. till Slack/Discord-webhook senare om vi vill ha mer aggressiv
#      notifiering.

name: youtube-validate-nightly

on:
  schedule:
    # 06:00 UTC = 07:00 CET / 08:00 CEST. Innan användare börjar spela
    # på morgonen så vi har tid att fixa eventuella brutna klipp.
    - cron: '0 6 * * *'
  # Manuell trigger via Actions-UI:t för att kunna köra ad-hoc utan att
  # vänta på nästa schemalagda körning (t.ex. efter manuell katalog-edit).
  workflow_dispatch:
    inputs:
      apply_fixes:
        description: 'Auto-patcha YAML-filer med bästa ersättning (--apply)'
        type: boolean
        default: false
      threshold:
        description: 'Lägsta poäng för auto-patch (default 5)'
        type: string
        default: '5'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Run youtube-autofix (validera + föreslå ersättningar)
        id: autofix
        working-directory: backend
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # autofix.ts exit:ar 1 om brutna klipp kvarstår efter ev. auto-patch,
        # vilket markerar jobbet rött + triggar GitHub:s default-failure-mejl.
        # Med apply_fixes=true patchas YAML automatiskt med top-scored kandidat
        # (poäng >= threshold, inga block-reasons).
        run: |
          ARGS="--all"
          if [ "${{ inputs.apply_fixes }}" = "true" ]; then
            ARGS="$ARGS --apply --threshold ${{ inputs.threshold || '5' }}"
          fi
          npx tsx youtube/autofix.ts $ARGS

      - name: Ladda upp rapport som CI-artefakt
        # Körs alltid — rapporten är värdefull både vid success (tom = alla OK)
        # och failure (innehåller lista brutna klipp + föreslagna ersättningar).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-autofix-report
          path: backend/output/youtube-autofix-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Committa auto-patchade filer (om apply_fixes=true och något ändrades)
        if: ${{ inputs.apply_fixes == true }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet backend/content/catalog/; then
            git add backend/content/catalog/
            git commit -m "chore: auto-replace broken YouTube clips (autofix nightly)"
            git push
          else
            echo "Inga YAML-ändringar att commita."
          fi
