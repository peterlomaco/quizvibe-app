# Publicerar en EAS Update (OTA) när nightly-jobbets clip-fix-PR mergas
# (2026-09-23). Bara bot-PR:ar från branchen bot/clip-fix triggar — vanliga
# pushar till master publicerar ALDRIG automatiskt (master kan bära otestad
# kod).
#
# Kanal: preview = TestFlight-byggena (eas.json staging-testflight). Byt till
# production vid launch.
#
# Kräver repo-secret EXPO_TOKEN (expo.dev → Account settings → Access tokens).

name: ota-on-clip-fix-merge

on:
  pull_request:
    types: [closed]
    branches: [master]

jobs:
  ota:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'bot/clip-fix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install app deps
        run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA (iOS, preview channel)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: npx eas update --branch preview --platform ios --environment preview --non-interactive --message "$PR_TITLE"
