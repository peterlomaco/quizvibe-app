# Låtar 1997-2012 — primär audience gen-z (1997-2012), millennials lyssnade
# samtidigt så audience inkluderar båda. 2 låtar per år enligt scope-plan.
# Val: 2 av 3 från Peters lista per år, undviker dubbletter med songs-all.yaml
# (...Baby One More Time 1998, Shape of You 2017 ligger där och rörs ej).
# Justering: 2008 = "Viva la Vida" istället för "Poker Face" så Lady Gaga
# inte fyrar två år i rad (2008+2009).
#
# media-curering: YouTube-pick med startSec=0 + endSec=videoDuration så
# klippet spelar hela låten (frontend bestämmer när det stoppas).
# Prioritet: officiell artist/label-kanal eller -Topic auto, sedan 7clouds,
# sedan consistent-quality lyric-channel. Extended versioner och live-tagningar
# undviks per policy — radio-edit eller album-version används.
#
# 1 item utan media — inga OK studio-versioner i YouTube-sök:
#   - beyonce-crazy-in-love (top-1 BLOCKED, top-2 är live, top-3 är Fifty
#     Shades-remix). Parkerat tills alternativ källa hittas.
