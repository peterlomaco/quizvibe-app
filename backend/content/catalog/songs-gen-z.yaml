# samtidigt så audience inkluderar båda. 2 låtar per år enligt scope-plan.
# Val: 2 av 3 från Peters lista per år, undviker dubbletter med songs-all.yaml
# (...Baby One More Time 1998, Shape of You 2017 ligger där och rörs ej).
# Justering: 2008 = "Viva la Vida" istället för "Poker Face" så Lady Gaga
# inte fyrar två år i rad (2008+2009).
#
# media-curering: YouTube-pick med startSec=0 + endSec=videoDuration så
# klippet spelar hela låten (frontend bestämmer när det stoppas).
