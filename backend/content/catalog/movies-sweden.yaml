# Svenska filmklassiker — kända i Sverige över generationer via bio, TV-repriser
# och streaming.
#
# Frågetyp: actor-select — spelar YouTubeKlipp och ber spelaren välja
# skådespelaren i huvudrollen bland 5-6 namnknappar.
