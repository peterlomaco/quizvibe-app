#
# Kategori 'songs' används som approximation (CategorySchema saknar 'movies').
# audience: fil-nivå täcker elder+gen-x+millennials som vuxit upp med dessa
# filmer; nyare titlar (2004+) har item-level override till millennials+gen-z.
# region: ["sweden"] — svensk igenkänning, ej global pool.
