# Låtar 2013-2024 — primär audience gen-alpha (2013-2028), gen-z lyssnade
# samtidigt så audience inkluderar båda. Cap:ad vid 2024 (release-år).
# 2025/2026-items borttagna tills åren har vägt sig kulturellt.
#
# Policy (reviderad 2026-08-11 av Peter): correctYear = året för DEN HÄR
# ARTISTENS första release av spåret — album eller singel, det som kom
# först (t.ex. "Sweet Child o' Mine" = 1987 = Appetite for Destruction,
# inte 1988 = singeln). En tidigare inspelning av en ANNAN artist räknas
# INTE — itemet är artistens inspelning, inte kompositionen. Tidigare löd
# regeln "singel-release-år"; för items i DENNA fil gav båda reglerna
# samma svar eftersom singlarna nedan alla föregick sina album.
#
# Chart-peak är fortsatt ALDRIG svaret — det är releasen som räknas:
#   - "Old Town Road" — Lil Nas X: dec 2018 release (ej mainstream-2019-peak)
#   - "Blinding Lights" — The Weeknd: nov 2019 release (ej 2020-peak)
#   - "APT." — ROSÉ & Bruno Mars: okt 2024 release (ej 2025-peak)
#   - "Die With a Smile" — Lady Gaga & Bruno Mars: aug 2024 release (ej 2025-peak)
#
# Borttaget pga. > 2024 release-cap:
#   - "Abracadabra" — Lady Gaga (feb 2025)
#   - "Ordinary" — Alex Warren (sannolikt 2025)
#
# Tillagt: "Dynamite" — BTS (aug 2020) för att fylla 2020 efter att Blinding
# Lights flyttats till 2019. 2018 har 3 items och 2024 har 4 — medvetet
# obalans pga. flera iconic releases dessa år.
#
# media-curering: YouTube-pick med startSec=0 + endSec=videoDuration så
# klippet spelar hela låten (frontend bestämmer när det stoppas).
# Prioritet: 7clouds-style lyric-channel för konsistens; fallback till
# officiell artist/label-kanal eller annan consistent-quality lyric-channel.
#
# Tidigare 3 items utan media (UMG-blocked i SE/EU) löste sig 2026-05-26:
# Taylor Swift + Billie Eilish via Topic-channel uploads (auto-uploaded
# studio-master från label — annan region-policy än music-videon). ROSÉ
# APT via official MV (ekr2nIex040, blocked endast i BY+RU, OK i SE).
