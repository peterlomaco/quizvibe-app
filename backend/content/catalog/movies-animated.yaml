# Animerade filmer — kända bland svenska familjer 1940-2020.
# audience: ['all'] för cross-gen igenkänning (Disney/Pixar-klassiker).
# correctYear = ursprunglig release-år (inte remake-år).
# category: songs är approximation — CategorySchema saknar 'animated-movie'.
# Frågetext: "Which Year was this Movie launched?"
#
# Kalle Anka = Mickey's Trailer (1938), Musse Pigg = Steamboat Willie (1928).
# Båda är korta filmer (~8 min) som ingår i det svenska julaftonsutbudet.
audience: ["elder", "gen-x", "millennials", "gen-z", "gen-alpha"]
region: ["sweden"]
category: songs
contentForm: youtube
contentSubject: movie
