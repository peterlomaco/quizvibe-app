# Låtar 1965-1980 — primär audience är gen-x (1965-1980), äldre boomers
# växte också upp med dessa så audience inkluderar elder.
# 1 låt per år enligt content-katalogens scope-plan.
# Mix av rock, pop, soul, disco. Beatles cap:as till max 4 år för variation.
# media-fältet lämnas off-katalog tills `npm run youtube-search <item-id>`
# har körts och en specifik videoId + start/endSec är vald.
audience: ["gen-x", "elder"]
category: songs
contentForm: youtube
contentSubject: song
