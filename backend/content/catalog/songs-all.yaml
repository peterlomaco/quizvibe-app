# Välkända låtar — items där alla generationer (inom V1-svensk-målgrupp)
# associerar låten direkt. correctYear = året låten släpptes (single eller
# album). wikimediaSearchHints behålls trots att songs-pipelinen är YouTube-
# driven — schemat kräver minst en hint, och sökorden gör double-duty om vi
# senare vill plocka bild från Wikimedia (artistporträtt, albumcover) som
# fallback.
#
# `audience: ['all']` betyder att låten är kända av ALLA generationer
# (elder + gen-x + millennials + gen-z + gen-alpha) — INTE att den är
# global/cross-region. Region (Sverige vs Global) är en separat axel som
# hanteras via `region`-tag i V2. Items här är fortfarande Sweden-only i
# V1 om de inte explicit får `region: Global` i Release 2.
#
# Cross-gen-iconic items (flyttade hit från gen-specifika filer 2026-05-22):
# Over the Rainbow, Heartbreak Hotel, Bohemian Rhapsody, Hotel California,
# Billie Jean, I Will Always Love You, My Heart Will Go On, Someone Like You,
# Wake Me Up, Blinding Lights. Reasoning: dessa låtar har Sverige-cross-gen-
# recognition via klassiker-revivals (Queen-film 2018, MJ-arvet, Whitney-
# memorials), Spotify/streaming-tillgänglighet (svenska gen-z hittar dem),
# TikTok-effekter (Wake Me Up + Blinding Lights), och konstant radio-rotation.
# Era-filter respekterar fortsatt correctYear så ett 70-tal-spel inte får
# 2019-låtar.
audience: ["all"]
region: ["sweden"]
category: songs
contentForm: youtube
contentSubject: song
