# Länder kända över alla generationer — flagg-baserade items.
# Frågetext "Which country is this?". Visuellt särskild från capitals
# (städer visar skyline/landmärken; länder visar flaggor) så ingen
# semantic-overlap mellan question-typer.
# Country-items är era-agnostiska (samma som capitals) — ingen correctYear,
# endast name-letters-svarsmodell.
audience: ["all"]
region: ["sweden"]
category: capitals
contentForm: image
contentSubject: country
