<!doctype html>
<!--
  QuizVibe – e-postbekräftelse-landningssida.

  Hit landar användaren efter att ha klickat på aktiveringslänken i
  "Confirm your email"-mailet. Supabase verifierar token:en och redirectar
  hit (via emailRedirectTo i signUp() + tillåten Redirect URL i dashboard).

  MEDVETET en STATISK .html UTAN Jekyll-front-matter → Jekyll kopierar den
  verbatim (ingen theme-layout runt), så vi äger hela sidan. Nås på
  https://quizvibe.se/email-confirmed.html (publiceras från docs/ på master).

  Brand Master (2026-10-20): metallisk Q + wordmark från
  assets/brand/quizvibe-logo.svg (kopia av design/brand/quizvibe-logo.svg),
  navy-kort, tunn guldkant + liten guld-✓ = klart/giltigt. Inga externa anrop.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B1220" />
  <title>Email confirmed — QuizVibe</title>
  <link rel="icon" type="image/svg+xml" href="assets/brand/quizvibe-mark.svg" />
  <style>
    :root {
      --bg: #0B1220;
      --card: #121A29;
      --border: #232D40;
      --gold: #F5A623;
      --text: #FFFFFF;
      --body: #C9D1DE;
      --muted: #A8B3C7;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 28px 24px;
      text-align: center;
    }
    .logo { width: 132px; height: auto; margin: 0 auto; display: block; }
    .tagline {
      font-size: 13px;
      line-height: 1.4;
      color: var(--muted);
      margin: 14px 0 0;
    }
    .divider { height: 1px; background: var(--border); margin: 28px 0; }
    .check {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      border-radius: 50%;
      border: 1px solid rgba(245, 166, 35, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 22px;
      line-height: 1.3;
      font-weight: 700;
      margin: 0 0 10px;
      color: var(--text);
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--body);
      margin: 0 0 6px;
    }
    .hint {
      margin-top: 22px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer {
      margin-top: 28px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <main class="card">
      <img class="logo" src="assets/brand/quizvibe-logo.svg" alt="QuizVibe"
           width="132" height="109" />
      <p class="tagline">Music. Film/TV. Memories.</p>

      <div class="divider" aria-hidden="true"></div>

      <div class="check" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M20 6 L9 17 L4 12" stroke="#F5A623" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <h1>Email address confirmed</h1>
      <p>Your QuizVibe account is now active.</p>
      <p>Please log in to the QuizVibe app to start playing.</p>

      <p class="hint">You can close this window and return to the app.</p>

      <p class="footer">QuizVibe is operated by LoMaCo AB, Sweden.</p>
    </main>
  </div>
</body>
</html>
